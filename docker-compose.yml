services:
  apprankly:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DATA_DIR: /app/data
      APP_ORIGIN: ${APP_ORIGIN:?Set your HTTPS dashboard origin}
      JWT_SECRET: ${JWT_SECRET:?Set a strong random session secret}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set your bcrypt password hash}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_BUCKET_NAME: ${GOOGLE_BUCKET_NAME:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      APPLE_ISSUER_ID: ${APPLE_ISSUER_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_VENDOR_ID: ${APPLE_VENDOR_ID:-}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - apprankly_data:/app/data
    restart: unless-stopped
volumes:
  apprankly_data:
