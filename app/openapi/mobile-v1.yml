openapi: 3.0.3
info:
  title: AppRankly mobile API
  version: 1.0.0
servers:
  - url: /api/v1
security:
  - deviceToken: []
paths:
  /auth/login:
    post:
      operationId: login
      summary: Start an owner device session
      description: Requires HTTPS in production. Shares the owner's web login rate limit.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password, maxLength: 256 }
      responses:
        '200': { $ref: '#/components/responses/Tokens' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /auth/refresh:
    post:
      operationId: refresh
      summary: Exchange a refresh token for a new token pair
      description: A successful exchange invalidates both old tokens. The refresh session has a fixed 30-day lifetime.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { $ref: '#/components/schemas/OpaqueToken' }
      responses:
        '200': { $ref: '#/components/responses/Tokens' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /auth/me:
    get:
      operationId: getOwner
      summary: Verify the current device session
      responses:
        '200':
          description: Owner session
          content:
            application/json:
              schema:
                type: object
                required: [owner]
                properties:
                  owner: { type: boolean, enum: [true] }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current device session
      responses:
        '204':
          description: Both device tokens have been revoked
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /apps:
    get:
      operationId: listApps
      summary: List owned apps and store discovery warnings
      responses:
        '200':
          description: App catalog
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppCatalog' }
        '401': { $ref: '#/components/responses/Error' }
  /apps/visibility:
    get:
      operationId: listAppVisibility
      summary: List visible and hidden apps for the iPhone settings screen
      responses:
        '200':
          description: Current owner visibility and store discovery warnings
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/AppCatalog' }
                  - type: object
                    required: [hidden]
                    properties:
                      hidden:
                        type: array
                        items:
                          type: object
                          required: [id, name, platform, packageName]
                          properties:
                            id: { type: string }
                            name: { type: string }
                            platform: { type: string, enum: [apple, google] }
                            packageName: { type: string }
        '401': { $ref: '#/components/responses/Error' }
  /apps/{appId}/visibility:
    parameters:
      - $ref: '#/components/parameters/AppId'
    put:
      operationId: setAppVisibility
      summary: Hide or restore an app in the mobile API
      description: A hidden app is excluded from mobile reports and app routes. Restoration preserves history and works even if the app is temporarily unavailable from its store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hidden]
              properties:
                hidden: { type: boolean }
      responses:
        '200':
          description: Visibility updated
          content:
            application/json:
              schema: { type: object, properties: { success: { type: boolean } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /apps/{appId}/icon:
    parameters:
      - $ref: '#/components/parameters/AppId'
    get:
      operationId: getAppIcon
      summary: Load an owned app icon through the server's store-image proxy
      responses:
        '200':
          description: Store icon
          content:
            'image/*':
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /overview:
    parameters:
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
    get:
      operationId: getOverview
      summary: Load the portfolio for a reporting period and the immediately preceding period
      description: Dates are inclusive. Supply both bounds for a custom range, or omit them for 30 days ending yesterday UTC.
      parameters:
        - name: platform
          in: query
          schema: { type: string, enum: [apple, google] }
      responses:
        '200': { $ref: '#/components/responses/Analytics' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /apps/{appId}/analytics:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
    get:
      operationId: getAppAnalytics
      summary: Load current and previous metrics for one owned app
      responses:
        '200': { $ref: '#/components/responses/Analytics' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /apps/{appId}/analytics/countries:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
    get:
      operationId: getCountryBreakdown
      summary: Country-level installations and original currency values
      responses:
        '200':
          description: Country breakdown
          content:
            application/json:
              schema:
                type: object
                required: [rows]
                properties:
                  installStatus: { type: string, enum: [available, unavailable], description: Present for Google Play }
                  revenueStatus: { $ref: '#/components/schemas/SourceCoverage' }
                  rows:
                    type: array
                    items:
                      type: object
                      required: [country, installs, revenueByCurrency]
                      properties:
                        country: { type: string, description: ISO 3166-1 alpha-2 territory }
                        installs: { type: integer, nullable: true }
                        revenueByCurrency: { $ref: '#/components/schemas/Amounts' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /apps/{appId}/analytics/versions:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
    get:
      operationId: getVersionBreakdown
      summary: Installations by app version
      responses:
        '200':
          description: Version breakdown
          content:
            application/json:
              schema:
                type: object
                required: [rows]
                properties:
                  rows:
                    type: array
                    items:
                      type: object
                      required: [label, installs]
                      properties:
                        label: { type: string }
                        installs: { type: integer, nullable: true }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /apps/{appId}/analytics/purchases:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
    get:
      operationId: getPurchaseBreakdown
      summary: In-app purchases, subscriptions and refunds by day and product
      responses:
        '200':
          description: Purchase breakdown. Missing reports can also return NO_REPORTS.
          content:
            application/json:
              schema:
                type: object
                required: [available, purchases]
                properties:
                  available: { type: boolean }
                  purchases:
                    type: object
                    nullable: true
                    required: [daily, products, totals]
                    properties:
                      daily:
                        type: array
                        items:
                          type: object
                          required: [date, iap, subscription, refunds]
                          properties:
                            date: { type: string, format: date }
                            iap: { type: integer }
                            subscription: { type: integer }
                            refunds: { type: integer }
                      products:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/PurchaseTotal'
                            - type: object
                              required: [kind, sku, title]
                              properties:
                                kind: { type: string, enum: [iap, subscription] }
                                sku: { type: string }
                                title: { type: string }
                      totals:
                        type: object
                        required: [iap, subscription]
                        properties:
                          iap: { $ref: '#/components/schemas/PurchaseTotal' }
                          subscription: { $ref: '#/components/schemas/PurchaseTotal' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /apps/{appId}/analytics/releases:
    parameters:
      - $ref: '#/components/parameters/AppId'
    get:
      operationId: getReleaseImpact
      summary: Impact of recent releases using the server's rolling window
      responses:
        '200':
          description: Recent releases and before/after metrics
          content:
            application/json:
              schema:
                type: object
                required: [releases]
                properties:
                  releases:
                    type: array
                    items:
                      type: object
                      required: [id, date, label, days, before, after, change, rpiChange, reviews, low]
                      properties:
                        id: { type: string }
                        date: { type: string, format: date }
                        label: { type: string }
                        days: { type: integer }
                        before: { type: number, nullable: true }
                        after: { type: number, nullable: true }
                        change: { type: number, nullable: true, description: Install change percent }
                        rpiChange: { type: number, nullable: true, description: Revenue per installation change percent }
                        reviews: { type: integer }
                        low: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /exchange-rates:
    get:
      operationId: getExchangeRates
      summary: USD conversion rates and their source
      responses:
        '200':
          description: A rate is the USD value of one unit of the original currency
          content:
            application/json:
              schema:
                type: object
                required: [base, source, status, rates]
                properties:
                  base: { type: string, enum: [USD] }
                  source: { type: string }
                  status: { type: string, enum: [available, stale, unavailable] }
                  fetchedAt: { type: string, format: date-time }
                  rates:
                    type: object
                    additionalProperties:
                      type: object
                      required: [rate, date]
                      properties:
                        rate: { type: number, minimum: 0, exclusiveMinimum: true }
                        date: { type: string, format: date, nullable: true }
        '401': { $ref: '#/components/responses/Error' }
  /reviews:
    get:
      operationId: listReviews
      summary: Read saved reviews across owned applications
      parameters:
        - { name: appId, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/ReviewStatus'
        - $ref: '#/components/parameters/ReviewStars'
        - $ref: '#/components/parameters/ReviewCursor'
        - $ref: '#/components/parameters/ReviewPageSize'
      responses:
        '200': { $ref: '#/components/responses/ReviewPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /reviews/refresh:
    post:
      operationId: refreshReviews
      summary: Refresh archive data from one or all owned stores
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                appId: { type: string }
      responses:
        '200':
          description: Per-app source results. Saved rows remain readable during provider failures.
          content:
            application/json:
              schema:
                type: object
                required: [sources]
                properties:
                  sources: { type: array, items: { $ref: '#/components/schemas/ReviewSource' } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /apps/{appId}/reviews:
    parameters:
      - $ref: '#/components/parameters/AppId'
    get:
      operationId: listAppReviews
      summary: Read the saved review archive for one owned app
      parameters:
        - $ref: '#/components/parameters/ReviewStatus'
        - $ref: '#/components/parameters/ReviewStars'
        - $ref: '#/components/parameters/ReviewCursor'
        - $ref: '#/components/parameters/ReviewPageSize'
      responses:
        '200': { $ref: '#/components/responses/ReviewPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /apps/{appId}/reviews/{reviewId}:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/ReviewId'
    get:
      operationId: getReview
      summary: Read one review and its archive source status
      responses:
        '200':
          description: Saved review and source status
          content:
            application/json:
              schema:
                type: object
                required: [review, source]
                properties:
                  review: { $ref: '#/components/schemas/Review' }
                  source: { $ref: '#/components/schemas/ReviewSource' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /apps/{appId}/reviews/{reviewId}/reply:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/ReviewId'
    put:
      operationId: setReviewReply
      summary: Publish or edit one confirmed store response
      description: Preserve the exact operation ID, revision, and text across connection retries. An ambiguous operation is reconciled by reading the official store. After an unresolved attempt settles, obtain a fresh revision and confirmation before making a different request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ReviewReplyInput'
                - type: object
                  required: [confirmed]
                  properties:
                    confirmed: { type: boolean, enum: [true] }
      responses:
        '200':
          description: Store accepted or confirmed the reply. Apple can report pending visibility.
          content:
            application/json:
              schema:
                type: object
                required: [review]
                properties:
                  review: { $ref: '#/components/schemas/Review' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /apps/{appId}/reviews/bulk-replies:
    parameters:
      - $ref: '#/components/parameters/AppId'
    post:
      operationId: publishBulkReplies
      summary: Publish up to 20 unique, explicitly confirmed replies for one app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed, items]
              properties:
                confirmed: { type: boolean, enum: [true] }
                items:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    allOf:
                      - $ref: '#/components/schemas/ReviewReplyInput'
                      - type: object
                        required: [reviewId]
                        properties:
                          reviewId: { type: string }
                question: { type: string, maxLength: 1000 }
                includeMetrics: { type: boolean, default: false }
                range: { type: object, properties: { startDate: { type: string, format: date }, endDate: { type: string, format: date } } }
      responses:
        '200':
          description: Individual outcomes in request order. A row failure does not roll back successes.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [reviewId, review, error]
                      properties:
                        reviewId: { type: string, nullable: true }
                        review: { type: object, nullable: true, allOf: [{ $ref: '#/components/schemas/Review' }] }
                        error: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /review-templates:
    get:
      operationId: listReviewTemplates
      responses:
        '200':
          description: Saved templates shared with web
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                properties:
                  templates: { type: array, items: { $ref: '#/components/schemas/ReviewTemplate' } }
        '401': { $ref: '#/components/responses/Error' }
    post:
      operationId: createReviewTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, body]
              properties:
                name: { type: string, maxLength: 60 }
                body: { type: string, maxLength: 5970 }
      responses:
        '201':
          description: Saved template
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewTemplate' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /review-templates/{templateId}:
    delete:
      operationId: deleteReviewTemplate
      parameters:
        - { name: templateId, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Template deleted or already removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
        '401': { $ref: '#/components/responses/Error' }
  /inbox:
    get:
      operationId: listInboxTasks
      summary: Prioritized review, source and analytics tasks for the selected range
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Tasks use the same ordering rules as web
          content:
            application/json:
              schema:
                type: object
                required: [tasks]
                properties:
                  tasks:
                    type: array
                    items:
                      type: object
                      required: [key, kind, app]
                      properties:
                        key: { type: string }
                        kind: { type: string }
                        app: { $ref: '#/components/schemas/StoreApp' }
                        count: { type: integer }
                        sample: { type: object, nullable: true, additionalProperties: true }
                        anomaly: { type: object, additionalProperties: true }
                        lastDate: { type: string, format: date }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /apps/{appId}/keywords:
    parameters:
      - $ref: '#/components/parameters/AppId'
    get:
      operationId: listTrackedKeywords
      summary: List keywords and the latest check for one store market
      parameters:
        - $ref: '#/components/parameters/KeywordCountry'
      responses:
        '200':
          description: Market, supported markets and tracked keywords. A failed check retains the most recent valid position.
          content:
            application/json:
              schema:
                type: object
                required: [market, markets, keywords, source]
                properties:
                  market: { $ref: '#/components/schemas/KeywordMarket' }
                  markets: { type: array, items: { $ref: '#/components/schemas/KeywordMarket' } }
                  keywords: { type: array, items: { $ref: '#/components/schemas/TrackedKeyword' } }
                  source: { type: string, enum: [public_store_search] }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: trackKeywords
      summary: Track a manual term or a list of selected suggestions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [term]
                  properties:
                    term: { type: string, minLength: 1, maxLength: 80 }
                - type: object
                  required: [terms]
                  properties:
                    terms: { type: array, minItems: 1, maxItems: 25, items: { type: string, minLength: 1, maxLength: 80 } }
      responses:
        '201':
          description: Tracked terms after trimming and deduplication
          content:
            application/json:
              schema:
                type: object
                required: [success, added]
                properties:
                  success: { type: boolean }
                  added: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /apps/{appId}/keywords/{keywordId}:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/KeywordId'
    delete:
      operationId: untrackKeyword
      summary: Remove a tracked keyword and its rank history
      responses:
        '200': { $ref: '#/components/responses/ASOMutation' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /apps/{appId}/keywords/{keywordId}/history:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/KeywordId'
      - $ref: '#/components/parameters/KeywordCountry'
    get:
      operationId: getKeywordRankHistory
      summary: Latest successful result per UTC day for the past 90 days
      responses:
        '200':
          description: Historical ranks for one market
          content:
            application/json:
              schema:
                type: object
                required: [id, term, market, points]
                properties:
                  id: { type: integer }
                  term: { type: string }
                  market: { $ref: '#/components/schemas/KeywordMarket' }
                  points:
                    type: array
                    items:
                      type: object
                      required: [date, checkedAt, rank, topN]
                      properties:
                        date: { type: string, format: date }
                        checkedAt: { type: string, format: date-time }
                        rank: { type: integer, nullable: true }
                        topN: { type: integer, minimum: 0 }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /apps/{appId}/rank-checks:
    parameters:
      - $ref: '#/components/parameters/AppId'
    post:
      operationId: startRankCheck
      summary: Start or resume a check for up to 20 oldest or unchecked keywords in a market
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                country: { type: string, default: us, enum: [us, vn, gb, jp, kr, de, fr] }
      responses:
        '202': { $ref: '#/components/responses/RankCheck' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /apps/{appId}/rank-checks/{jobId}:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getRankCheck
      summary: Read the result of a rank check scoped to this app
      responses:
        '200': { $ref: '#/components/responses/RankCheck' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /apps/{appId}/listing:
    parameters:
      - $ref: '#/components/parameters/AppId'
    get:
      operationId: getPublicStoreListing
      summary: Read public listing metadata for an owned application
      responses:
        '200':
          description: Public store listing
          content:
            application/json:
              schema:
                type: object
                required: [title, subtitle, description, developer, rating, storeUrl, source]
                properties:
                  title: { type: string }
                  subtitle: { type: string, nullable: true }
                  description: { type: string, nullable: true }
                  developer: { type: string, nullable: true }
                  rating: { type: number, nullable: true }
                  storeUrl: { type: string, format: uri, nullable: true }
                  source: { type: string, enum: [public_listing] }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /apps/{appId}/competitors:
    parameters:
      - $ref: '#/components/parameters/AppId'
    get:
      operationId: listOrSearchCompetitors
      summary: List pinned competitors or search the app's store
      parameters:
        - { name: q, in: query, schema: { type: string, minLength: 1, maxLength: 100 } }
        - $ref: '#/components/parameters/KeywordCountry'
      responses:
        '200':
          description: Competitor list
          content:
            application/json:
              schema:
                type: object
                properties:
                  competitors: { type: array, items: { $ref: '#/components/schemas/Competitor' } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
    post:
      operationId: pinCompetitor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [competitorId]
              properties:
                competitorId: { type: string }
      responses:
        '201': { $ref: '#/components/responses/ASOMutation' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /apps/{appId}/competitors/{competitorId}:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - { name: competitorId, in: path, required: true, schema: { type: string } }
    delete:
      operationId: unpinCompetitor
      responses:
        '200': { $ref: '#/components/responses/ASOMutation' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /apps/{appId}/campaigns:
    parameters:
      - $ref: '#/components/parameters/AppId'
    get:
      operationId: listCampaigns
      responses:
        '200':
          description: Campaign links for the owned app and store
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaigns: { type: array, items: { $ref: '#/components/schemas/Campaign' } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: createCampaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, source]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                source: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '201':
          description: New link. Resolve its path against the backend origin, outside /api/v1.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /apps/{appId}/campaigns/{campaignId}:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - { name: campaignId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    delete:
      operationId: deleteCampaign
      responses:
        '200': { $ref: '#/components/responses/ASOMutation' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /ai/previews:
    post:
      operationId: previewAIDraft
      summary: Preview the exact input and provider before requesting a draft, keyword suggestions or store analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, appId]
              properties:
                kind: { type: string, enum: [reviewReply, keywords, audit, variants, reviews, ask] }
                country: { type: string, enum: [us, vn, gb, jp, kr, de, fr] }
                count: { type: integer, minimum: 5, maximum: 25 }
                locale: { type: string, enum: [vi, en] }
                appId: { type: string }
                reviewId: { type: string }
                question: { type: string, maxLength: 1000 }
                includeMetrics: { type: boolean, default: false }
                range: { type: object, properties: { startDate: { type: string, format: date }, endDate: { type: string, format: date } } }
      responses:
        '200':
          description: Single-use preview bound to the authenticated device session
          content:
            application/json:
              schema:
                type: object
                required: [previewId, expiresAt, destination, payload]
                properties:
                  previewId: { type: string }
                  expiresAt: { type: string, format: date-time }
                  destination:
                    type: object
                    required: [provider]
                    properties:
                      provider: { type: string }
                      origin: { type: string }
                      model: { type: string }
                  payloadJSON: { type: string, description: Formatted copy of the analysis payload }
                  payload:
                    type: object
                    required: [app, kind]
                    properties:
                      app:
                        oneOf:
                          - { type: string }
                          - type: object
                            properties:
                              name: { type: string }
                              packageName: { type: string }
                              platform: { type: string }
                      kind: { type: string }
                      review:
                        type: object
                        properties:
                          text: { type: string }
                          rating: { type: integer, nullable: true }
                          language: { type: string, nullable: true }
                      locale: { type: string }
                      market: { $ref: '#/components/schemas/KeywordMarket' }
                      limit: { type: integer }
                      maxTermLength: { type: integer }
                      listing: { type: object, additionalProperties: { type: string } }
                      keywords: { type: array, items: { type: string } }
                      competitors: { type: array, items: { type: string } }
                      replyLimit: { type: integer }
                      instruction: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /ai/runs:
    post:
      operationId: generateAIDraft
      summary: Generate an editable draft, keyword suggestions or store analysis using a confirmed preview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [previewId, confirmed]
              properties:
                previewId: { type: string }
                confirmed: { type: boolean, enum: [true] }
      responses:
        '200':
          description: Draft, suggestions or analysis. Store changes require separate endpoints.
          content:
            application/json:
              schema:
                type: object
                properties:
                  text: { type: string }
                  result: { type: object }
                  provider: { type: string }
                  model: { type: string }
                  suggestions:
                    type: array
                    items:
                      type: object
                      required: [term, reason]
                      properties:
                        term: { type: string }
                        reason: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /settings:
    get:
      operationId: getSettings
      summary: Read owner settings
      responses:
        '200':
          description: Read owner settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerSettings' }
        '401': { $ref: '#/components/responses/Error' }
    put:
      operationId: updateSettings
      summary: Update owner settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshIntervalHours: { type: integer, minimum: 1, maximum: 24 }
                notificationsEnabled: { type: boolean }
                digest: { type: string, enum: [off, daily, weekly] }
                digestHour: { type: integer, minimum: 0, maximum: 23 }
                digestLocale: { type: string, enum: [vi, en] }
                anomalyThreshold: { type: integer, minimum: 10, maximum: 90 }
      responses:
        '200':
          description: Update owner settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerSettings' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /apps/google:
    post:
      operationId: addGooglePackage
      summary: Track a Google Play package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [packageName]
              properties:
                packageName: { type: string }
      responses:
        '201':
          description: Track a Google Play package
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerSettings' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /apps/google/{packageName}:
    delete:
      operationId: removeGooglePackage
      summary: Stop tracking a Google Play package
      parameters:
        - { name: packageName, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Stop tracking a Google Play package
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerSettings' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /integrations:
    get:
      operationId: getIntegrations
      summary: Read integration availability and AI provider metadata
      responses:
        '200':
          description: Read integration availability and AI provider metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerIntegrations' }
        '401': { $ref: '#/components/responses/Error' }
  /integrations/{platform}/test:
    post:
      operationId: testIntegration
      summary: Test Google Play or App Store credentials
      parameters:
        - { name: platform, in: path, required: true, schema: { type: string, enum: [google, apple] } }
      responses:
        '200':
          description: Test Google Play or App Store credentials
          content:
            application/json:
              schema: { type: object, properties: { success: { type: boolean } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /sync:
    get:
      operationId: getSyncStatus
      summary: Read the latest scheduler status
      responses:
        '200':
          description: Read the latest scheduler status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncStatus' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      operationId: startSync
      summary: Start or resume tracking an in-progress sync job
      responses:
        '202':
          description: Start or resume tracking an in-progress sync job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncJob' }
        '401': { $ref: '#/components/responses/Error' }
  /sync/{jobId}:
    get:
      operationId: getSyncJob
      summary: Read the current sync job
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Read the current sync job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncJob' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /notifications:
    get:
      operationId: getNotifications
      summary: Read the owner notification feed
      responses:
        '200':
          description: Read the owner notification feed
          content:
            application/json:
              schema: { type: object, properties: { notifications: { type: array, items: { type: object } }, unreadCount: { type: integer } } }
        '401': { $ref: '#/components/responses/Error' }
  /notifications/read:
    post:
      operationId: markNotificationsRead
      summary: Mark one notification or all notifications as read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string }
      responses:
        '200':
          description: Mark one notification or all notifications as read
          content:
            application/json:
              schema: { type: object, properties: { success: { type: boolean } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /notifications/{id}:
    delete:
      operationId: deleteNotification
      summary: Delete a notification
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Delete a notification
          content:
            application/json:
              schema: { type: object, properties: { success: { type: boolean } } }
        '401': { $ref: '#/components/responses/Error' }
  /notifications/test:
    post:
      operationId: sendTestNotification
      summary: Send a confirmed test to configured notification channels
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed]
              properties:
                confirmed: { type: boolean, enum: [true] }
      responses:
        '200':
          description: Send a confirmed test to configured notification channels
          content:
            application/json:
              schema: { type: object, properties: { channels: { type: object, additionalProperties: { type: string, enum: [sent, skipped, failed] } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /digest:
    get:
      operationId: previewDigest
      summary: Preview a digest
      parameters:
        - { name: period, in: query, schema: { type: string, enum: [daily, weekly] } }
      responses:
        '200':
          description: Preview a digest
          content:
            application/json:
              schema: { type: object, properties: { title: { type: string }, message: { type: string }, data: { type: object } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /digest/send:
    post:
      operationId: sendDigest
      summary: Send a confirmed digest to configured notification channels
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed]
              properties:
                period: { type: string, enum: [daily, weekly] }
                confirmed: { type: boolean, enum: [true] }
      responses:
        '200':
          description: Send a confirmed digest to configured notification channels
          content:
            application/json:
              schema: { type: object, properties: { channels: { type: object, additionalProperties: { type: string, enum: [sent, skipped, failed] } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /apps/{appId}/events:
    get:
      operationId: listAppEvents
      summary: List manual events and store release and campaign markers
      parameters:
        - { $ref: '#/components/parameters/AppId' }
      responses:
        '200':
          description: List manual events and store release and campaign markers
          content:
            application/json:
              schema: { type: object, properties: { events: { type: array, items: { $ref: '#/components/schemas/OwnerEvent' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: createAppEvent
      summary: Add a manual app event
      parameters:
        - { $ref: '#/components/parameters/AppId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, label]
              properties:
                date: { type: string, format: date }
                label: { type: string, maxLength: 80 }
      responses:
        '201':
          description: Add a manual app event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerEvent' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /apps/{appId}/events/{id}:
    delete:
      operationId: deleteAppEvent
      summary: Delete a manual event from its owning app
      parameters:
        - { $ref: '#/components/parameters/AppId' }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Delete a manual event from its owning app
          content:
            application/json:
              schema: { type: object, properties: { success: { type: boolean } } }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /export:
    get:
      operationId: exportReport
      summary: Download portfolio data for the selected date range
      parameters:
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { name: format, in: query, schema: { type: string, enum: [json, csv] } }
        - { name: appId, in: query, schema: { type: string } }
      responses:
        '200':
          description: Download portfolio data for the selected date range
          content:
            application/json:
              schema: { type: object, properties: { range: { type: object }, apps: { type: array, items: { type: object } }, exchangeRates: { type: object } } }
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /apps/{appId}/ai/latest:
    get:
      operationId: getLatestAIAnalysis
      summary: Read the latest saved analysis for an owned app
      parameters:
        - { $ref: '#/components/parameters/AppId' }
      responses:
        '200':
          description: Read the latest saved analysis for an owned app
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIAnalysis' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
components:
  parameters:
    AppId:
      name: appId
      in: path
      required: true
      schema: { type: string }
      description: Opaque ID from GET /apps
    From:
      name: from
      in: query
      schema: { type: string, format: date }
    To:
      name: to
      in: query
      schema: { type: string, format: date }
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema: { type: string, maxLength: 500 }
    ReviewStatus:
      name: status
      in: query
      schema: { type: string, enum: [all, unanswered, answered], default: all }
    ReviewStars:
      name: stars
      in: query
      schema: { type: integer, minimum: 1, maximum: 5 }
    ReviewCursor:
      name: cursor
      in: query
      schema: { type: string }
      description: Opaque token from the preceding page for the same filters
    ReviewPageSize:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
    KeywordCountry:
      name: country
      in: query
      schema: { type: string, default: us, enum: [us, vn, gb, jp, kr, de, fr] }
    KeywordId:
      name: keywordId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer
  schemas:
    OwnerSettings:
      type: object
      properties:
        refreshIntervalHours: { type: integer, minimum: 1, maximum: 24 }
        notificationsEnabled: { type: boolean }
        digest: { type: string, enum: [off, daily, weekly] }
        digestHour: { type: integer, minimum: 0, maximum: 23 }
        digestLocale: { type: string, enum: [vi, en] }
        anomalyThreshold: { type: integer, minimum: 10, maximum: 90 }
        timezone: { type: string }
        googlePackages: { type: array, items: { type: string } }
    OwnerIntegrations:
      type: object
      properties:
        google: { type: object, properties: { configured: { type: boolean } } }
        apple: { type: object, properties: { configured: { type: boolean } } }
        notifications: { type: object, properties: { configured: { type: boolean } } }
        ai: { type: object }
    SyncStatus:
      type: object
      properties:
        status: { type: string }
        lastRun: { type: string, format: date-time, nullable: true }
        appsChecked: { type: integer, nullable: true }
        sources: { type: object, additionalProperties: { $ref: '#/components/schemas/SyncSource' } }
    SyncJob:
      type: object
      properties:
        id: { type: string }
        state: { type: string, enum: [running, completed, skipped, failed] }
        appsChecked: { type: integer, nullable: true }
        sources: { type: object, additionalProperties: { $ref: '#/components/schemas/SyncSource' } }
    SyncSource:
      type: object
      properties:
        attempted: { type: integer, minimum: 0 }
        withReports: { type: integer, minimum: 0 }
    OwnerEvent:
      type: object
      properties:
        id: { type: string }
        date: { type: string, format: date }
        type: { type: string }
        label: { type: string }
        source: { type: string }
    AIAnalysis:
      type: object
      properties:
        result: { type: object, nullable: true }
        kind: { type: string, nullable: true }
        provider: { type: string, nullable: true }
        model: { type: string, nullable: true }
    OpaqueToken:
      type: string
      pattern: '^[A-Za-z0-9_-]{43}$'
    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken: { $ref: '#/components/schemas/OpaqueToken' }
        refreshToken: { $ref: '#/components/schemas/OpaqueToken' }
        expiresIn: { type: integer, minimum: 1, maximum: 900, description: Access token lifetime in seconds }
    StoreApp:
      type: object
      required: [id, name, platform, packageName, rating, version, storeUrl, iconAvailable, metadataError]
      properties:
        id: { type: string }
        name: { type: string }
        platform: { type: string, enum: [apple, google] }
        packageName: { type: string }
        rating: { type: number, nullable: true }
        version: { type: string, nullable: true }
        storeUrl: { type: string, format: uri, nullable: true }
        iconAvailable: { type: boolean }
        metadataError: { type: string, nullable: true }
    SourceWarning:
      type: object
      required: [platform, error]
      properties:
        platform: { type: string, enum: [apple, google] }
        error: { type: string }
    AppCatalog:
      type: object
      required: [apps, warnings]
      properties:
        apps:
          type: array
          items: { $ref: '#/components/schemas/StoreApp' }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/SourceWarning' }
    Range:
      type: object
      required: [startDate, endDate]
      properties:
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
    Amounts:
      type: object
      description: Values denominated in the ISO 4217 currency named by each key
      additionalProperties: { type: number }
    SourceCoverage:
      type: string
      enum: [available, partial, unavailable]
    AppReport:
      type: object
      required: [app, installs, activeDevices, retention, lastDate, error, sourceStatus, revenue, daily]
      properties:
        app: { $ref: '#/components/schemas/StoreApp' }
        installs: { type: integer, nullable: true }
        activeDevices: { type: integer, nullable: true }
        retention: { type: number, nullable: true }
        lastDate: { type: string, format: date, nullable: true }
        error: { type: string, nullable: true }
        sourceStatus: { type: integer, nullable: true }
        revenue:
          type: object
          required: [basis, status, byCurrency]
          properties:
            basis:
              type: string
              enum: [estimated_developer_proceeds, gross_buyer_payments_including_tax]
            status: { $ref: '#/components/schemas/SourceCoverage' }
            byCurrency: { $ref: '#/components/schemas/Amounts' }
        daily:
          type: array
          items:
            type: object
            required: [date, installs, uninstalls, upgrades, revenueByCurrency]
            properties:
              date: { type: string, format: date }
              installs: { type: integer, nullable: true }
              uninstalls: { type: integer, nullable: true }
              upgrades: { type: integer, nullable: true }
              revenueByCurrency: { $ref: '#/components/schemas/Amounts' }
    Analytics:
      type: object
      required: [range, previousRange, generatedAt, warnings, current, previous]
      properties:
        range: { $ref: '#/components/schemas/Range' }
        previousRange: { $ref: '#/components/schemas/Range' }
        generatedAt: { type: string, format: date-time }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/SourceWarning' }
        current:
          type: array
          items: { $ref: '#/components/schemas/AppReport' }
        previous:
          type: array
          items: { $ref: '#/components/schemas/AppReport' }
    PurchaseTotal:
      type: object
      required: [purchases, refunds, revenueByCurrency]
      properties:
        purchases: { type: integer }
        refunds: { type: integer }
        revenueByCurrency: { $ref: '#/components/schemas/Amounts' }
    Review:
      type: object
      required: [app, id, text, source, canReply, replyState, revision, replyLimit]
      properties:
        app: { $ref: '#/components/schemas/StoreApp' }
        id: { type: string }
        author: { type: string, nullable: true }
        text: { type: string }
        rating: { type: integer, nullable: true }
        date: { type: string, nullable: true }
        territory: { type: string, nullable: true }
        language: { type: string, nullable: true }
        source: { type: string, enum: [official, public, report] }
        canReply: { type: boolean }
        replyText: { type: string, nullable: true }
        replyDate: { type: string, nullable: true }
        replyState: { type: string, enum: [unanswered, pending, published] }
        revision: { type: string, pattern: '^[0-9a-f]{64}$' }
        replyLimit: { type: integer, enum: [350, 5970] }
    ReviewReplyInput:
      type: object
      required: [text, expectedRevision, operationId]
      properties:
        text: { type: string }
        expectedRevision: { type: string, pattern: '^[0-9a-f]{64}$' }
        operationId: { type: string, format: uuid }
    ReviewSource:
      type: object
      required: [appId, status, checkedAt]
      properties:
        appId: { type: string }
        status: { type: string, enum: [available, unavailable, unknown] }
        checkedAt: { type: string, format: date-time, nullable: true }
    ReviewTemplate:
      type: object
      required: [id, name, body]
      properties:
        id: { type: integer }
        name: { type: string }
        body: { type: string }
    KeywordMarket:
      type: object
      required: [country, language]
      properties:
        country: { type: string, enum: [us, vn, gb, jp, kr, de, fr] }
        language: { type: string }
    TrackedKeyword:
      type: object
      required: [id, term, source, rank, topN, checkedAt, attemptedAt, status]
      properties:
        id: { type: integer }
        term: { type: string }
        source: { type: string }
        addedAt: { type: string }
        rank: { type: integer, nullable: true }
        topN: { type: integer, nullable: true }
        checkedAt: { type: string, format: date-time, nullable: true }
        attemptedAt: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [ranked, outside, no_results, source_failed, unchecked] }
    Competitor:
      type: object
      required: [id, title, rating, pinned]
      properties:
        id: { type: string }
        title: { type: string }
        rating: { type: number, nullable: true }
        pinned: { type: boolean }
    Campaign:
      type: object
      required: [id, name, source, path, clicks, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        source: { type: string }
        path: { type: string, pattern: '^/l/[a-z0-9-]+$' }
        clicks: { type: integer, minimum: 0 }
        createdAt: { type: string, nullable: true }
  responses:
    ASOMutation:
      description: Change saved
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean }
    RankCheck:
      description: Background check. A completed job can contain both successes and source failures.
      content:
        application/json:
          schema:
            type: object
            required: [id, country, state, checked, failed, error]
            properties:
              id: { type: string, format: uuid }
              country: { type: string }
              state: { type: string, enum: [running, completed, failed] }
              checked: { type: integer }
              failed: { type: integer }
              error: { type: string, nullable: true }
    ReviewPage:
      description: Newest reviews first, with stable paging across equal dates
      content:
        application/json:
          schema:
            type: object
            required: [reviews, sources, nextCursor]
            properties:
              reviews: { type: array, items: { $ref: '#/components/schemas/Review' } }
              sources: { type: array, items: { $ref: '#/components/schemas/ReviewSource' } }
              nextCursor: { type: string, nullable: true }
    Analytics:
      description: Current and previous periods. A source can fail while other apps remain available.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Analytics' }
    Tokens:
      description: Device session credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TokenPair' }
    Error:
      description: Request failed
      headers:
        X-Request-Id:
          schema: { type: string, format: uuid }
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, requestId]
                properties:
                  code:
                    type: string
                    enum: [INVALID_INPUT, HTTPS_REQUIRED, INVALID_LOGIN, AUTH_REQUIRED, REQUEST_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE, LOGIN_RATE_LIMIT, RATE_LIMIT, NOT_FOUND, APP_NOT_FOUND, NO_REPORTS, INVALID_PLATFORM, INVALID_DATE_RANGE, REVIEW_NOT_FOUND, INVALID_REVIEW_REPLY, PREVIEW_REQUIRED, REVIEW_REPLY_CONFLICT, IDEMPOTENCY_CONFLICT, REVIEW_REPLY_UNCERTAIN, REVIEW_REPLY_IN_PROGRESS, REVIEW_REPLY_NOT_VERIFIED, REVIEWS_PERMISSION_REQUIRED, REVIEW_REPLY_FAILED, AI_NOT_CONFIGURED, AI_INVALID_RESPONSE, AI_EMPTY_RESPONSE, AI_OUTPUT_TRUNCATED, INVALID_MARKET, INVALID_KEYWORD, KEYWORD_NOT_FOUND, RANK_CHECK_NOT_FOUND, RANK_CHECK_BUSY, RANK_SOURCE_FAILED, LISTING_UNAVAILABLE, COMPETITOR_NOT_FOUND, CAMPAIGN_NOT_FOUND, OPERATION_FAILED]
                  requestId: { type: string, format: uuid }
